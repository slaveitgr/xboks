name: CI

on:
  push:
    branches: [main, develop]
    # Approval metadata promotes existing bytes; it must not rebuild the launcher.
    paths-ignore: [.github/release-validation.json]
  pull_request:
    paths-ignore: [.github/release-validation.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install account-free runtime fixture toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gjs dbus-daemon libgtk-4-bin gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Check source without compiling a distribution candidate
        if: github.ref != 'refs/heads/main'
        run: npm run typecheck && npm run test
      - name: Build and check the main candidate once
        if: github.ref == 'refs/heads/main'
        run: npm run build
      - run: npm run test:runtime-tools
      - run: npm run test:ci-tools
      - name: Check offline MSIX inspection with synthetic packages
        run: npm run test:msix
      - name: Check GNOME extension logic and staging without the host Shell
        run: node --test scripts/desktop/gnome-experience.test.mjs scripts/desktop/native-experience.test.mjs scripts/desktop/delegated-switcher-control.test.mjs scripts/desktop/delegated-switcher-transport.test.mjs scripts/desktop/overlay-key-lease.test.mjs scripts/desktop/gobject-overlay-lease.test.mjs scripts/desktop/home-launcher.test.mjs scripts/desktop/home-prefs.test.mjs scripts/desktop/feral-gamemode.test.mjs scripts/desktop/apps-client.test.mjs
      - name: Check standalone extension packaging and schema compilation
        run: python3 -m unittest discover -s scripts/desktop -p test_stage_gnome_experience.py
      - name: Check original-client enrollment with isolated process fixtures
        run: python3 -m unittest discover -s scripts/desktop -p test_native_client_enrollment.py
      - name: Check reference decoders with synthetic packages only
        run: |
          for xboks_test_file in scripts/analysis/test-*.py; do
            python3 "$xboks_test_file"
          done
      - name: Check resident Game Bar installer without changing user services
        run: python3 scripts/desktop/install-gamebar-service.test.py
      - name: Check Guide-only controller input with synthetic events
        run: python3 scripts/desktop/gamebar-controller.test.py
      - name: Build launcher candidate (never publish)
        if: github.ref == 'refs/heads/main'
        run: npx --no-install electron-builder --linux AppImage --publish never
      - name: Bind candidate to source and checksums
        if: github.ref == 'refs/heads/main'
        run: node scripts/ci/artifact-manifest.mjs write launcher release
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: launcher-candidate
          path: |
            release/*.AppImage
            release/*.AppImage.sha512sum
            release/candidate.json
          if-no-files-found: error
          retention-days: 3
